name: Build on main push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [esp32c3, esp32s3, esp32, esp8266]
    steps:
      - uses: actions/checkout@v4
      
      - name: Get Next Version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: main

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio intelhex

      # SEMVER must be exported, not just assigned: buildscript_versioning.py reads it
      # from the environment to stamp include/version.h.
      - name: Build PlatformIO Project
        env:
          SEMVER: ${{ steps.semver.outputs.next }}
        run: pio run -e ${{ matrix.environment }}

      - name: Upload BIN Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}-${{ steps.semver.outputs.next }}.bin
          path: .pio/build/${{ matrix.environment }}/firmware.bin
          if-no-files-found: error

      - name: Upload ELF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}-${{ steps.semver.outputs.next }}.elf
          path: .pio/build/${{ matrix.environment }}/firmware.elf
          if-no-files-found: error
