; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32c3, esp32s3, esp32, esp8266
name = WiFiClimateSensor
description = WiFi Climate Sensor

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
extra_scripts = 
	pre:buildscript_versioning.py
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps = 
	ESP32Async/AsyncTCP@^3.4.10
	ESP32Async/ESPAsyncWebServer@^3.11.0
	knolleary/PubSubClient@^2.8
	ropg/ezTime@^0.8.3
	jsc/ArduinoLog@^1.2.1
	bblanchon/ArduinoJson@^7.4.3
	bblanchon/StreamUtils@^1.9.2
	ayushsharma82/ElegantOTA@^3.1.7
	robtillaart/DS18B20@^0.2.6
	adafruit/DHT sensor library@^1.4.7
	adafruit/Adafruit BME280 Library@^2.3.0
	adafruit/Adafruit BME680 Library@^2.0.5
	adafruit/Adafruit AHTX0@^2.0.6
	adafruit/Adafruit INA219@^1.2.3
	adafruit/Adafruit SSD1306@^2.5.16
	adafruit/Adafruit GFX Library@^1.12.6
build_flags = 
	-D CORE_DEBUG_LEVEL=4
	-D ELEGANTOTA_USE_ASYNC_WEBSERVER=1

[env:esp8266]
platform = espressif8266
board = esp12e
lib_deps = 
	${env.lib_deps}
	
[env:esp32]
platform = espressif32
board = esp32doit-devkit-v1
; The Arduino 3.x core outgrew the 1.25MB app slot of the stock default.csv;
; min_spiffs.csv gives two 1.875MB OTA slots and this project keeps its web
; assets in PROGMEM, so the filesystem partition goes unused.
board_build.partitions = min_spiffs.csv
lib_deps = 
	${env.lib_deps}
	
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
; The Arduino 3.x core outgrew the 1.25MB app slot of the stock default.csv;
; min_spiffs.csv gives two 1.875MB OTA slots and this project keeps its web
; assets in PROGMEM, so the filesystem partition goes unused.
board_build.partitions = min_spiffs.csv
monitor_speed = 460800
monitor_rts = 0
monitor_dtr = 0
lib_compat_mode = strict
build_flags = ${env.build_flags}
	-D ARDUINO_LOLIN_C3_MINI
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps = 
	${env.lib_deps}

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
; The esp32-s3-devkitc-1 profile assumes the N8 module (8MB) and its default_8MB.csv
; partition table, which a 4MB module rejects at boot. min_spiffs.csv fits two 1.875MB
; OTA slots inside 4MB, and this project keeps its web assets in PROGMEM so the
; filesystem partition goes unused either way.
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv
build_flags = ${env.build_flags}
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps = 
	${env.lib_deps}
